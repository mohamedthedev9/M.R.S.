# UNTESTED: written without access to GitHub or npm. Commit package-lock.json (created by your first npm install) for npm ci.
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run security:scan
      - run: npm run audit:deps
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
